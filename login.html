<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso · Oposiciones TAI</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#6d3df5"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png"><script>try{if(localStorage.getItem('theme'))document.documentElement.dataset.theme=localStorage.getItem('theme')}catch(e){}</script><script src="auth.js"></script>
<style>
.lg{min-height:100vh;display:grid;place-items:center;padding:1.2rem;position:relative;overflow:hidden;background:var(--bg)}
.lg:before,.lg:after{content:"";position:absolute;width:44rem;height:44rem;border-radius:50%;filter:blur(70px);opacity:.35;animation:fl 14s ease-in-out infinite alternate;pointer-events:none}
.lg:before{background:#7c3aed;top:-18rem;left:-14rem}.lg:after{background:#4c1d95;bottom:-20rem;right:-12rem;animation-delay:-6s}
@keyframes fl{to{transform:translate(4rem,3rem) scale(1.15)}}
.lgbg{position:absolute;left:0;top:0;bottom:0;width:min(70vw,1100px);z-index:0;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,#000 45%,transparent);mask-image:linear-gradient(90deg,#000 45%,transparent)}.lgbg img{width:100%;height:100%;object-fit:cover;object-position:left bottom;opacity:.9}.lgc{position:relative;z-index:1;width:100%;max-width:400px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:22px;padding:1.8rem 1.6rem 1.4rem;box-shadow:0 20px 60px #0002;animation:up .5s ease both}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
.lgl{display:flex;align-items:center;gap:.7rem;margin-bottom:1.1rem}.lgl img{width:44px;height:44px;border-radius:12px}.lgl b{font-size:1.15rem;display:block}.lgl small{color:var(--mut,#777)}
.lgt{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--code);border-radius:12px;padding:4px;margin-bottom:1.2rem}
.lgt i{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--card);border-radius:9px;box-shadow:0 2px 8px #0002;transition:transform .28s cubic-bezier(.4,1.3,.5,1)}
.lgt.reg i{transform:translateX(100%)}.lgt button{position:relative;z-index:1;border:0;background:none;padding:.55rem;font-weight:600;cursor:pointer;color:var(--mut,#777);transition:color .2s}.lgt button.on{color:var(--fg)}
.fld{position:relative;margin-bottom:.9rem}.fld input{width:100%;padding:1.35rem .9rem .5rem;border:1.5px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--fg);font-size:1rem;outline:0;transition:border-color .2s,box-shadow .2s}
.fld label{position:absolute;left:.95rem;top:.95rem;color:var(--mut,#777);pointer-events:none;transition:all .18s;font-size:1rem}
.fld input:focus{border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 20%,transparent)}
.fld input:focus+label,.fld input:not(:placeholder-shown)+label{top:.35rem;font-size:.7rem;color:var(--ac);font-weight:600}
.eye{position:absolute;right:.5rem;top:.55rem;border:0;background:none;font-size:1.1rem;cursor:pointer;padding:.3rem;opacity:.7}
.xtra{max-height:0;opacity:0;overflow:hidden;margin-bottom:0!important;transition:max-height .3s,opacity .3s,margin .3s}.xtra.show{max-height:80px;opacity:1;margin-bottom:.9rem!important}
.lgb{width:100%;padding:.85rem;border:0;border-radius:12px;background:linear-gradient(135deg,#8b5cf6,#5b21d6);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .2s;display:flex;justify-content:center;align-items:center;gap:.6rem}
.lgb:hover{transform:translateY(-1px);box-shadow:0 8px 20px color-mix(in srgb,var(--ac) 40%,transparent)}.lgb:disabled{opacity:.7;cursor:wait;transform:none}
.sp{width:18px;height:18px;border:3px solid #fff5;border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;display:none}.lgb:disabled .sp{display:block}@keyframes rot{to{transform:rotate(360deg)}}
#msg{min-height:1.4rem;margin:.7rem 0 0;font-size:.9rem;text-align:center}#msg.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.lgn{margin-top:1rem;font-size:.78rem;color:var(--mut,#777);text-align:center;line-height:1.4}.lgback{position:absolute;top:1rem;left:1.2rem;z-index:2;color:var(--mu);text-decoration:none;font-size:.9rem}.lgth{position:absolute;top:1rem;right:1rem;z-index:2;border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:.35rem .6rem;cursor:pointer}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<button class="lgth" id="thm" title="Tema claro/oscuro">🌓</button>
<main class="lg"><div class="lgbg"><img src="img/login-bg.webp" alt=""></div><form class="lgc" id="f" autocomplete="on">
<div class="lgl"><img src="img/logo.png" alt=""><div><b>TAI - Oposiciones</b><small>Temario · Auxiliar de Informática · AGE</small></div></div>
<div class="lgt" id="tabs"><i></i><button type="button" id="tl" class="on">Entrar</button><button type="button" id="tr">Crear cuenta</button></div>
<div class="fld"><input id="u" placeholder=" " autocomplete="username" required autocapitalize="none" spellcheck="false"><label for="u">Usuario</label></div>
<div class="fld"><input id="p" type="password" placeholder=" " autocomplete="current-password" required minlength="6"><label for="p">Contraseña</label><button type="button" class="eye" id="eye" aria-label="Mostrar contraseña">👁</button></div>
<div class="fld xtra" id="invw"><input id="inv" placeholder=" " autocomplete="off" spellcheck="false"><label for="inv">Código de invitación</label></div>
<button class="lgb" id="go" type="submit"><span class="sp"></span><span id="gt">Entrar</span></button>
<p id="msg" class="ko" role="alert"></p>
<p class="lgn" id="note">Tu progreso se guarda en este dispositivo. <b>Nada de SQL se guarda.</b></p>
</form></main>
<script>
var $=function(i){return document.getElementById(i)},reg=false;
function mode(r){reg=r;$('tabs').className='lgt'+(r?' reg':'');$('tl').className=r?'':'on';$('tr').className=r?'on':'';$('gt').textContent=r?'Crear cuenta':'Entrar';$('p').autocomplete=r?'new-password':'current-password';$('msg').textContent='';if(AUTH.remote)$('invw').className='fld xtra'+(r?' show':'')}
$('tl').onclick=function(){mode(false)};$('tr').onclick=function(){mode(true)};
if(AUTH.remote)$('note').innerHTML='Cuenta <b>única para todos tus dispositivos</b>: tu progreso se sincroniza solo. <b>Nada de SQL se guarda.</b> Se anota la IP de cada sesión y puedes cerrarlas desde ☁ Sync.';
else if(!Object.keys(JSON.parse(localStorage.getItem('tai_users')||'{}')).length)mode(true);
$('eye').onclick=function(){var s=$('p').type==='password';$('p').type=s?'text':'password';this.style.opacity=s?1:.7};
$('thm').onclick=function(){var d=document.documentElement,c=d.dataset.theme||'dark',n=c==='dark'?'light':'dark';d.dataset.theme=n;try{localStorage.setItem('theme',n)}catch(e){}};
function bad(t){var m=$('msg');m.className='ko';m.textContent=t;void m.offsetWidth;m.classList.add('shake');$('go').disabled=false}
$('f').onsubmit=function(e){e.preventDefault();$('msg').textContent='';$('go').disabled=true;
 (reg?AUTH.register($('u').value,$('p').value,$('inv').value):AUTH.login($('u').value,$('p').value)).then(function(){$('msg').className='ok';$('msg').textContent='¡Bienvenido!';var nx=new URLSearchParams(location.search).get('next');if(!nx||/^(https?:)?\/\//.test(nx)||nx.indexOf('..')>=0)nx='index.html';location.replace(nx)}).catch(function(x){bad(x.message);if(/invitaci/i.test(x.message)&&!reg)mode(true)})};
</script></body></html>
