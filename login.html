<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso · Oposiciones TAI</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#6d3df5"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png"><script>try{if(localStorage.getItem('theme'))document.documentElement.dataset.theme=localStorage.getItem('theme')}catch(e){}</script><script src="auth.js"></script>
<link rel="stylesheet" href="login.css"></head><body class="login-page">
<button class="lgth" id="thm" title="Tema claro/oscuro">🌓</button>
<main class="lg">
<div class="lgbg"><img src="img/login-bg.webp" alt=""></div>
<section class="login-intro"><p class="eyebrow">Técnicos Auxiliares de Informática · AGE</p><h1>Prepara tu<br>oposición TAI.</h1><p>Accede a tus resúmenes, simulacros y prácticas.</p></section>
<form class="lgc" id="f" autocomplete="on">
<div class="lgl"><img src="img/logo.png" alt=""><div><b>TAI Oposiciones</b><small>Acceso a tu espacio de estudio</small></div></div>
<div class="lgt" id="tabs"><i></i><button type="button" id="tl" class="on">Entrar</button><button type="button" id="tr">Crear cuenta</button></div>
<div class="fld"><input id="u" placeholder=" " autocomplete="username" required autocapitalize="none" spellcheck="false"><label for="u">Usuario</label></div>
<div class="fld"><input id="p" type="password" placeholder=" " autocomplete="current-password" required minlength="6"><label for="p">Contraseña</label><button type="button" class="eye" id="eye" aria-label="Mostrar contraseña">👁</button></div>
<div class="fld xtra" id="invw"><input id="inv" placeholder=" " autocomplete="off" spellcheck="false"><label for="inv">Código de invitación</label></div>
<button class="lgb" id="go" type="submit"><span class="sp"></span><span id="gt">Entrar</span></button>
<p id="msg" class="ko" role="alert"></p>
<p class="lgn" id="note">Tu progreso se guarda en este dispositivo. <b>Nada de SQL se guarda.</b></p>
</form></main>
<script>
var $=function(i){return document.getElementById(i)},reg=false;
function mode(r){reg=r;$('tabs').className='lgt'+(r?' reg':'');$('tl').className=r?'':'on';$('tr').className=r?'on':'';$('gt').textContent=r?'Crear cuenta':'Entrar';$('p').autocomplete=r?'new-password':'current-password';$('msg').textContent='';if(AUTH.remote)$('invw').className='fld xtra'+(r?' show':'')}
$('tl').onclick=function(){mode(false)};$('tr').onclick=function(){mode(true)};
if(AUTH.remote)$('note').innerHTML='Cuenta <b>única para todos tus dispositivos</b>: tu progreso se sincroniza solo. <b>Nada de SQL se guarda.</b> Se anota la IP de cada sesión y puedes cerrarlas desde ☁ Sync.';
else if(!Object.keys(JSON.parse(localStorage.getItem('tai_users')||'{}')).length)mode(true);
$('eye').onclick=function(){var s=$('p').type==='password';$('p').type=s?'text':'password';this.style.opacity=s?1:.7};
$('thm').onclick=function(){var d=document.documentElement,c=d.dataset.theme||'dark',n=c==='dark'?'light':'dark';d.dataset.theme=n;try{localStorage.setItem('theme',n)}catch(e){}};
function bad(t){var m=$('msg');m.className='ko';m.textContent=t;void m.offsetWidth;m.classList.add('shake');$('go').disabled=false}
$('f').onsubmit=function(e){e.preventDefault();$('msg').textContent='';$('go').disabled=true;
 (reg?AUTH.register($('u').value,$('p').value,$('inv').value):AUTH.login($('u').value,$('p').value)).then(function(){$('msg').className='ok';$('msg').textContent='¡Bienvenido!';var nx=new URLSearchParams(location.search).get('next');if(!nx||/^(https?:)?\/\//.test(nx)||nx.indexOf('..')>=0)nx='index.html';location.replace(nx)}).catch(function(x){bad(x.message);if(/invitaci/i.test(x.message)&&!reg)mode(true)})};
</script></body></html>
