name: Desplegar API (Cloudflare Worker)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['worker/**']
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Desplegar con Wrangler
        id: wr
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
      - name: URL del Worker
        run: echo "URL=${{ steps.wr.outputs.deployment-url }}" | tee -a "$GITHUB_STEP_SUMMARY"
